name: Deploy UNIARC Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd /home/reddy/projects/final_backend

            git fetch origin
            git reset --hard origin/main

            source venv/bin/activate

            python -m pip install --upgrade pip

            pip install -r requirements.txt \
              --extra-index-url https://download.pytorch.org/whl/cpu

            sudo systemctl restart uniarc

            sleep 5

            sudo systemctl status uniarc --no-pager

            curl -f https://api.uniarc.online/api/v2/system/health
# Deployment workflow for UNIARC Backend
