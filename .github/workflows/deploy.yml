name: Deploy UNIARC Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            echo "===== Deploying UNIARC Backend ====="

            cd /home/reddy/projects/final_backend

            echo "Updating repository..."
            git fetch origin
            git reset --hard origin/main

            echo "Activating virtual environment..."
            source venv/bin/activate

            echo "Upgrading pip..."
            python -m pip install --upgrade pip

            echo "Installing dependencies..."
            pip install -r requirements.txt \
              --extra-index-url https://download.pytorch.org/whl/cpu

            echo "Restarting backend..."
            sudo /usr/bin/systemctl restart uniarc

            sleep 5

            echo "Checking backend status..."
            sudo /usr/bin/systemctl status uniarc

            echo "Running health check..."
            curl -f https://api.uniarc.online/api/v2/system/health

            echo "Deployment completed successfully."
